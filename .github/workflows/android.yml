name: Android CI

on:
  push:
    branches: [master, redesign, real-miuix]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Android SDK platform
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'"
      - name: Build and lint
        run: ./gradlew testDebugUnitTest assembleDebug lintDebug
      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: DSU-Sideloader-redesign
          path: app/build/outputs/apk/debug/*.apk
      - name: Archive lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
