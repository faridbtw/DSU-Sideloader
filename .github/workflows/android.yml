name: Android CI

on:
  push:
    branches: [master, redesign]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and lint
        run: ./gradlew assembleDebug lintDebug
      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: DSU-Sideloader-redesign
          path: app/build/outputs/apk/debug/*.apk
      - name: Archive lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
