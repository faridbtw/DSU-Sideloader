<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
  <title id="title">DSU Sideloader — Design Edition</title>
  <desc id="desc">A new system. A fresh start. A native Android interface built with Jetpack Compose.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#161727"/><stop offset="1" stop-color="#242249"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b9b4ff" stop-opacity=".35"/><stop offset="1" stop-color="#7771e8" stop-opacity=".08"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#7971f2" stop-opacity=".22"/><stop offset="1" stop-color="#7971f2" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1440" height="440" rx="28" fill="url(#bg)"/>
  <circle cx="1150" cy="220" r="340" fill="url(#glow)"/>
  <g fill="none" stroke="#b7b2fc" stroke-opacity=".08"><circle cx="1150" cy="220" r="180"/><circle cx="1150" cy="220" r="260"/><path d="M860 0v440M1040 0v440M1220 0v440M1400 0v440M800 80h640M800 260h640"/></g>
