    <text x="64" y="170" fill="#f4f3ff" font-size="72" font-weight="700" letter-spacing="-3">A new system.</text>
    <text x="64" y="250" fill="#bab4ff" font-size="72" font-weight="700" letter-spacing="-3">A fresh start.</text>
    <text x="68" y="302" fill="#b5b6cc" font-size="23">A cleaner way to explore Android.</text>
